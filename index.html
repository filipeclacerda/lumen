<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./src-tauri/icons/icon.png" />
    <title>Lumen</title>
    <style>
      body {
        margin: 0;
        background: #f7f8f5;
      }
      .initial-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #155c47;
        font-family: system-ui, "Segoe UI", sans-serif;
      }
      .initial-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .initial-loader-icon {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(0.98);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #131a18;
        }
        .initial-loader {
          color: #f7f8f5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-loader-content { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="initial-loader-content">
          <img class="initial-loader-icon" src="./src-tauri/icons/icon.png" alt="" aria-hidden="true" />
          <strong>Carregando Lumen...</strong>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
