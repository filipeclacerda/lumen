name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (por exemplo, v0.9.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  preflight:
    name: Validate release draft
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate tag and manifests
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python .agents/skills/generate-lumen-release/scripts/version_files.py check --root . --expect "${RELEASE_TAG#v}"

      - name: Validate release draft and notes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find((candidate) => candidate.tag_name === process.env.RELEASE_TAG);

            if (!release) throw new Error('Crie o draft da release para a tag antes de iniciar o build.');

            if (!release.draft) throw new Error('A release precisa permanecer em draft durante o build.');
            if (release.prerelease) throw new Error('O fluxo atual aceita apenas releases estaveis.');
            if (!release.name?.trim()) throw new Error('A release precisa ter titulo antes do build.');

            const body = release.body?.trim() ?? '';
            if (!body || body === 'Nova versao disponivel para download!') {
              throw new Error('Crie as notas reais da release antes de iniciar o build.');
            }

  release:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            cacheKey: windows-x64
            assetNamePattern: "Lumen-v[version]-windows-x64[setup][ext]"
            artifactPaths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.zip
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/nsis/*.nsis.zip
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            cacheKey: linux-x64
            assetNamePattern: "Lumen-v[version]-linux-x64[setup][ext]"
            artifactPaths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            cacheKey: macos-arm64
            assetNamePattern: "Lumen-v[version]-macos-arm64[setup][ext]"
            artifactPaths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            cacheKey: macos-x64
            assetNamePattern: "Lumen-v[version]-macos-x64[setup][ext]"
            artifactPaths: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "lumen-release-${{ matrix.cacheKey }}"
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Build and upload Lumen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        with:
          tagName: ${{ inputs.tag }}
          releaseDraft: true
          prerelease: false
          assetNamePattern: ${{ matrix.assetNamePattern }}
          args: ${{ matrix.args }}

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.artifactPaths }}
