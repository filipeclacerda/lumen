name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            assetNamePattern: "Lumen-v[version]-windows-x64[setup][ext]"
            artifactPaths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.zip
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/nsis/*.nsis.zip
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            assetNamePattern: "Lumen-v[version]-linux-x64[setup][ext]"
            artifactPaths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
            assetNamePattern: "Lumen-v[version]-macos-arm64[setup][ext]"
            artifactPaths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"
            assetNamePattern: "Lumen-v[version]-macos-x64[setup][ext]"
            artifactPaths: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "lumen-build"
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Build and Release Lumen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lumen v__VERSION__"
          releaseBody: "Nova versão disponível para download!"
          releaseDraft: true
          prerelease: false
          assetNamePattern: ${{ matrix.assetNamePattern }}
          args: ${{ matrix.args }}

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.artifactPaths }}
