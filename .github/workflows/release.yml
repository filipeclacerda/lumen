name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rustTargets: ""
            assetNamePattern: "Lumen-v[version]-windows-x64[setup][ext]"
            artifactPaths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.zip
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/nsis/*.nsis.zip
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            rustTargets: ""
            assetNamePattern: "Lumen-v[version]-linux-x64[setup][ext]"
            artifactPaths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            rustTargets: "aarch64-apple-darwin"
            assetNamePattern: "Lumen-v[version]-macos-arm64[setup][ext]"
            artifactPaths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            rustTargets: "x86_64-apple-darwin"
            assetNamePattern: "Lumen-v[version]-macos-x64[setup][ext]"
            artifactPaths: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "lumen-build"
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Build and Release Lumen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lumen v__VERSION__"
          releaseBody: "Nova versão disponível para download!"
          releaseDraft: true
          prerelease: false
          assetNamePattern: ${{ matrix.assetNamePattern }}
          args: ${{ matrix.args }}

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.artifactPaths }}

  verify-updater-manifest:
    name: Verify updater manifest
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Validate release assets and latest.json
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', ''),
            });

            const assets = new Set(release.data.assets.map((asset) => asset.name));
            const manifestAsset = release.data.assets.find((asset) => asset.name === 'latest.json');
            if (!manifestAsset) throw new Error('latest.json não foi publicado');

            const manifestResponse = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: manifestAsset.id,
              headers: { accept: 'application/octet-stream' },
            });
            const manifest = JSON.parse(Buffer.from(manifestResponse.data).toString('utf8'));
            const requiredPlatforms = ['darwin-aarch64', 'darwin-x86_64', 'linux-x86_64', 'windows-x86_64'];

            for (const platform of requiredPlatforms) {
              const entry = manifest.platforms?.[platform];
              if (!entry?.url || !entry?.signature) {
                throw new Error(`latest.json sem URL ou assinatura para ${platform}`);
              }
              const bundleName = new URL(entry.url).pathname.split('/').pop();
              if (platform.startsWith('darwin-') && !bundleName?.endsWith('.app.tar.gz')) {
                throw new Error(`Bundle inválido para ${platform}: ${bundleName}`);
              }
              if (!bundleName || !assets.has(bundleName)) {
                throw new Error(`Asset do updater ausente para ${platform}: ${bundleName}`);
              }
              if (!assets.has(`${bundleName}.sig`)) {
                throw new Error(`Assinatura do updater ausente para ${platform}: ${bundleName}.sig`);
              }
            }

            for (const assetName of [
              'Lumen-v' + manifest.version + '-macos-arm64.dmg',
              'Lumen-v' + manifest.version + '-macos-x64.dmg',
            ]) {
              if (!assets.has(assetName)) throw new Error(`DMG ausente: ${assetName}`);
            }
