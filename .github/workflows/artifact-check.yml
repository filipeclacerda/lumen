name: Artifact check

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release publicada (por exemplo, v0.9.0)"
        required: true
        type: string

concurrency:
  group: artifact-check-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify published assets and updater manifest
    runs-on: ubuntu-22.04
    steps:
      - name: Validate published release assets and latest.json
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error(`Tag invalida: ${tag}`);

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });

            if (release.draft) throw new Error('Publique a release antes do artifact check.');
            if (release.prerelease) throw new Error('O artifact check aceita apenas releases estaveis.');
            if (!release.published_at) throw new Error('A release nao possui data de publicacao.');

            const body = release.body?.trim() ?? '';
            if (!body || body === 'Nova versao disponivel para download!') {
              throw new Error('A release publicada precisa conter notas reais.');
            }

            const assets = new Set(release.assets.map((asset) => asset.name));
            const manifestAsset = release.assets.find((asset) => asset.name === 'latest.json');
            if (!manifestAsset) throw new Error('latest.json nao foi publicado.');

            const manifestResponse = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: manifestAsset.id,
              headers: { accept: 'application/octet-stream' },
            });
            const manifest = JSON.parse(Buffer.from(manifestResponse.data).toString('utf8'));
            if (manifest.version !== tag.slice(1)) {
              throw new Error(`Versao do latest.json (${manifest.version}) difere da tag ${tag}.`);
            }

            for (const platform of ['darwin-aarch64', 'darwin-x86_64', 'linux-x86_64', 'windows-x86_64']) {
              const entry = manifest.platforms?.[platform];
              if (!entry?.url || !entry?.signature) {
                throw new Error(`latest.json sem URL ou assinatura para ${platform}.`);
              }

              const bundleName = new URL(entry.url).pathname.split('/').pop();
              if (platform.startsWith('darwin-') && !bundleName?.endsWith('.app.tar.gz')) {
                throw new Error(`Bundle invalido para ${platform}: ${bundleName}`);
              }
              if (!bundleName || !assets.has(bundleName) || !assets.has(`${bundleName}.sig`)) {
                throw new Error(`Bundle ou assinatura do updater ausente para ${platform}.`);
              }
            }

            const version = manifest.version;
            const requiredAssets = [
              `Lumen-v${version}-windows-x64.msi`,
              `Lumen-v${version}-windows-x64.msi.sig`,
              `Lumen-v${version}-windows-x64-setup.exe`,
              `Lumen-v${version}-windows-x64-setup.exe.sig`,
              `Lumen-v${version}-linux-x64.deb`,
              `Lumen-v${version}-linux-x64.deb.sig`,
              `Lumen-v${version}-linux-x64.AppImage`,
              `Lumen-v${version}-linux-x64.AppImage.sig`,
              `Lumen-v${version}-macos-arm64.dmg`,
              `Lumen-v${version}-macos-arm64.app.tar.gz`,
              `Lumen-v${version}-macos-arm64.app.tar.gz.sig`,
              `Lumen-v${version}-macos-x64.dmg`,
              `Lumen-v${version}-macos-x64.app.tar.gz`,
              `Lumen-v${version}-macos-x64.app.tar.gz.sig`,
            ];

            for (const assetName of requiredAssets) {
              if (!assets.has(assetName)) throw new Error(`Asset ausente: ${assetName}`);
            }
